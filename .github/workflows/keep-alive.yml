# Supabase pauses free projects after 7 days without activity. This pings the database twice a week.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          curl --fail --silent --show-error \
            "${{ vars.SUPABASE_URL }}/rest/v1/leave_years?select=year&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_KEY }}"
